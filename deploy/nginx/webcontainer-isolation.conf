# Include this file inside the HTTPS `server` block that proxies Chinna-DIY.
# WebContainer requires a secure context plus cross-origin isolation.
# Hide upstream copies first so the browser receives one unambiguous value.

proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
